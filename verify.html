<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Keaslian Rapor - E-Rapor Kemendikdasmen</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%); min-height: 100vh; }
</style>
</head>
<body class="flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-slate-900 rounded-xl flex items-center justify-center mx-auto mb-3">
        <span class="text-yellow-400 font-extrabold text-2xl">✓</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Verifikasi Rapor</h1>
      <p class="text-slate-500 text-sm mt-1">Sistem E-Rapor Kurikulum Merdeka</p>
    </div>

    <div id="result" class="space-y-3 mb-4"></div>

    <form id="verifyForm" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Doc ID / NISN</label>
        <input id="docId" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="0011223344">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Hash (16 digit, opsional)</label>
        <input id="hash" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="a3f9c2e8b1d4f6a2">
      </div>
      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg">🔍 Verifikasi</button>
    </form>

    <p class="text-xs text-slate-400 text-center mt-4">Dokumen sah jika tidak ditemukan modifikasi hash</p>
  </div>

<script>
document.getElementById('verifyForm').onsubmit = (e) => {
  e.preventDefault();
  const docId = document.getElementById('docId').value.trim();
  const hash = document.getElementById('hash').value.trim();
  const out = document.getElementById('result');

  if (docId === '0011223344') {
    out.innerHTML = `
      <div class="p-4 bg-green-50 border-l-4 border-green-500 rounded">
        <p class="font-bold text-green-700">✅ Rapor Terverifikasi</p>
        <table class="text-sm text-slate-700 mt-3 w-full">
          <tr><td class="py-1">Nama</td><td class="font-semibold">: Ahmad Fauzi</td></tr>
          <tr><td class="py-1">NISN</td><td>: 0011223344</td></tr>
          <tr><td class="py-1">Kelas</td><td>: X-A</td></tr>
          <tr><td class="py-1">Semester</td><td>: Ganjil 2024/2025</td></tr>
          <tr><td class="py-1">Kepala Sekolah</td><td>: Dr. Budi Santoso, M.Pd</td></tr>
        </table>
      </div>`;
  } else {
    out.innerHTML = `
      <div class="p-4 bg-red-50 border-l-4 border-red-500 rounded">
        <p class="font-bold text-red-700">❌ Tidak Terverifikasi</p>
        <p class="text-sm text-red-600 mt-1">Doc ID tidak ditemukan dalam registry.</p>
      </div>`;
  }
};

// Auto-fill dari URL
const p = new URLSearchParams(location.search);
if (p.get('verify')) {
  document.getElementById('docId').value = p.get('verify');
  document.getElementById('verifyForm').dispatchEvent(new Event('submit'));
}
</script>
</body>
</html>
